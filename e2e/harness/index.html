      噪音大；夹具页只 import mermaid + 注册表 + 金样语料 + 画布能力包，把 app 的
      「渲染后处理」链（annotateNodeDataIds → nodeAnnotator → edgeAnnotator →
      addEdgeHitAreas）逐字复用，跑得最快也最稳。见 docs/adr/0018。
